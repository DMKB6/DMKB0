<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>The Last Dance Countdown</title>

    <link rel="stylesheet" href="the.css">

</head>

<body>

    <!-- Dark Overlay -->
    <div class="overlay"></div>


    <!-- Main Content -->
    <main class="container">

        <!-- Message -->
        <section class="message">

            <p>
                When the clock strikes noon,
                everything may look exactly the same...
            </p>

            <p>
                Except, I won't be there.
            </p>

            <p>
                Some goodbyes are never spoken.
            </p>

            <p class="highlight">
                Some stories end without a final line.
            </p>

        </section>


        <!-- Countdown -->
        <section class="countdown" id="countdown">

            <div class="time-box">

                <span id="days">00</span>

                <small>DAYS</small>

            </div>


            <div class="colon">:</div>


            <div class="time-box">

                <span id="hours">00</span>

                <small>HOURS</small>

            </div>


            <div class="colon">:</div>


            <div class="time-box">

                <span id="minutes">00</span>

                <small>MINUTES</small>

            </div>


            <div class="colon">:</div>


            <div class="time-box">

                <span id="seconds">00</span>

                <small>SECONDS</small>

            </div>

        </section>


        <!-- Date -->
        <div class="date">

            September 26 | Saturday | 5:00 PM

        </div>


        <!-- Title -->
        <div class="title">

            The Last Dance

        </div>

    </main>


    <script>

        /* =========================
           TARGET DATE & TIME
           September 26, 2026
           5:00 PM
        ========================== */

        const targetDate =
            new Date("2026-09-26T17:00:00").getTime();


        function updateCountdown() {

            const now =
                new Date().getTime();


            const distance =
                targetDate - now;


            /* Time's Up */

            if (distance <= 0) {

                document.getElementById("days").innerText = "00";

                document.getElementById("hours").innerText = "00";

                document.getElementById("minutes").innerText = "00";

                document.getElementById("seconds").innerText = "00";

                document.getElementById("countdown").classList.add("finished");

                return;

            }


            /* Calculate Time */

            const days =
                Math.floor(
                    distance /
                    (1000 * 60 * 60 * 24)
                );


            const hours =
                Math.floor(
                    (distance %
                    (1000 * 60 * 60 * 24)) /
                    (1000 * 60 * 60)
                );


            const minutes =
                Math.floor(
                    (distance %
                    (1000 * 60 * 60)) /
                    (1000 * 60)
                );


            const seconds =
                Math.floor(
                    (distance %
                    (1000 * 60)) /
                    1000
                );


            /* Show */

            document.getElementById("days").innerText =
                String(days).padStart(2, "0");


            document.getElementById("hours").innerText =
                String(hours).padStart(2, "0");


            document.getElementById("minutes").innerText =
                String(minutes).padStart(2, "0");


            document.getElementById("seconds").innerText =
                String(seconds).padStart(2, "0");

        }


        /* Start */

        updateCountdown();


        /* Update every second */

        setInterval(updateCountdown, 1000);

    </script>


</body>

</html>
