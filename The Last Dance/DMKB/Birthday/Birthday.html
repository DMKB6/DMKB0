<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>🎂 Friends Birthday Hub</title>

    <link rel="stylesheet" href="Birthday.css">
</head>

<body>

    <!-- Animated Background -->
    <div class="bg-animation">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


    <!-- Header -->
    <header class="header">

        <div class="cake">
            🎂
        </div>

        <h1>
            Friends Birthday Hub
        </h1>

        <p>
            Never Miss Your Friend's Special Day ❤️
        </p>

        <!-- Today's Date -->
        <div class="live-date"
             id="todayDate"></div>

    </header>



    <!-- Main -->
    <main>

        <section class="birthday-section">

            <div class="section-title">

                <span>🎉</span>

                <h2>
                    Birthday List
                </h2>

                <span>🎉</span>

            </div>


            <!-- Birthday Cards -->
            <div id="birthdayList"
                 class="birthday-grid">

                <!-- JavaScript এখানে Card তৈরি করবে -->

            </div>

        </section>

    </main>



    <!-- Footer -->
    <footer>

        <p>
            Made with ❤️ for Friends
        </p>

        <span>
            © 2026 Birthday Hub
        </span>

    </footer>



    <!-- Confetti -->
    <div id="confetti"></div>



    <!-- JavaScript -->
    <script src="Birthday.js"></script>

</html>
