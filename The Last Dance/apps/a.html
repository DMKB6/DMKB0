<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Apps Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #173b4d, transparent 35%),
                radial-gradient(circle at bottom right, #27194d, transparent 35%),
                #080b12;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            overflow-x: hidden;
        }

        .dashboard {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        .title {
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #9da7b8;
            margin-bottom: 35px;
            font-size: 15px;
        }

        .apps {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        .app-card {
            position: relative;
            min-height: 190px;
            padding: 30px 20px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            cursor: pointer;
            text-decoration: none;
            color: white;
            overflow: hidden;

            transition: 0.35s ease;
        }

        .app-card::before {
            content: "";
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(0, 255, 200, 0.12);
            top: -60px;
            right: -50px;
            filter: blur(10px);
        }

        .app-card:hover {
            transform: translateY(-8px);
            border-color: rgba(0, 255, 200, 0.5);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;
            font-size: 38px;

            background: rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 20px rgba(255,255,255,0.04);
        }

        .app-name {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .app-description {
            color: #9da7b8;
            font-size: 13px;
        }

        .footer {
            margin-top: 35px;
            color: #667085;
            font-size: 12px;
        }

        /* Mobile */
        @media (max-width: 600px) {

            body {
                padding: 18px;
            }

            .title {
                font-size: 28px;
            }

            .subtitle {
                margin-bottom: 25px;
            }

            .apps {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .app-card {
                min-height: 165px;
                padding: 25px 18px;
            }

            .icon {
                width: 65px;
                height: 65px;
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <main class="dashboard">

        <h1 class="title">My Apps</h1>

        <p class="subtitle">
            Choose an application to continue
        </p>


        <div class="apps">

            <!-- Namaj App -->
            <a href="namaj/n.html" class="app-card">

                <div class="icon">
                    🕌
                </div>

                <div class="app-name">
                    Namaj Time
                </div>

                <div class="app-description">
                    Prayer times & Islamic information
                </div>

            </a>


            <!-- Note Pad -->
            <a href="note/no.html" class="app-card">

                <div class="icon">
                    📝
                </div>

                <div class="app-name">
                    Note Pad
                </div>

                <div class="app-description">
                    Write and save your notes
                </div>

            </a>

        </div>


        <div class="footer">
            © 2026 • My Apps Dashboard
        </div>

    </main>

</body>

</html>
